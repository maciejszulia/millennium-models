name = "MillenniumModels"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MillenniumModels"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "MillenniumModels"

[[lean_exe]]
name = "figure"
root = "Figure"
