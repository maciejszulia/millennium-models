<text x="24.0" y="60.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Krzywa y² + y = x³ − x nad ciałem o p elementach. Punkt: para (p, a), gdzie a = p + 1 − liczba punktów krzywej.</text>
<text x="24.0" y="78.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Linia pomarańczowa: parabola a² = 4p.</text>
